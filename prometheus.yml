global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'fastapi-app'
    static_configs:
      - targets: ['web:8000']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['pg_exporter:9187']