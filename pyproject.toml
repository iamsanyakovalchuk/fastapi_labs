[tool.poetry]
name = "fastapi-lab1"
version = "0.1.0"
description = "FastAPI CRUD Project - Lab 3"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
pydantic = {extras = ["email"], version = "^2.0.0"}  # Онови цей рядок або додай нижче:
email-validator = "^2.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"